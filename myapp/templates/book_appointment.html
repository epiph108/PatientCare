<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PatientCare | Book Appointment</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f7fb;
        color: #243447;
      }

      /* =========================
       NAVBAR
    ========================== */

      .navbar {
        background: #176b87;
        padding: 18px 7%;
        color: white;
      }

      .navbar-inner {
        max-width: 1100px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }

      .nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .nav-link {
        color: white;
        text-decoration: none;
        font-size: 14px;
      }

      .nav-link:hover {
        text-decoration: underline;
      }

      /* =========================
       PAGE
    ========================== */

      .page-wrapper {
        width: 92%;
        max-width: 650px;
        margin: 55px auto;
      }

      /* =========================
       CARD
    ========================== */

      .appointment-card {
        background: white;
        border-radius: 14px;
        padding: 40px;
        box-shadow: 0 8px 30px rgba(23, 107, 135, 0.08);
      }

      .page-heading {
        margin: 0 0 8px;
        color: #176b87;
        font-size: 28px;
      }

      .page-description {
        margin: 0 0 30px;
        color: #718096;
        font-size: 14px;
        line-height: 1.6;
      }

      /* =========================
       DOCTOR INFO
    ========================== */

      .doctor-box {
        background: #f7fafc;
        border: 1px solid #e2ebf0;
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 28px;
      }

      .doctor-name {
        margin: 0 0 6px;
        color: #176b87;
        font-size: 20px;
      }

      .doctor-specialization {
        margin: 0;
        color: #718096;
        font-size: 14px;
      }

      /* =========================
       FORM
    ========================== */

      .form-group {
        margin-bottom: 22px;
      }

      .form-label {
        display: block;
        margin-bottom: 8px;
        color: #243447;
        font-size: 14px;
        font-weight: 600;
      }

      .form-input {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #d7e1e7;
        border-radius: 8px;
        background: white;
        color: #243447;
        font-size: 14px;
        font-family: Arial, Helvetica, sans-serif;
        outline: none;
      }

      .form-input:focus {
        border-color: #176b87;
      }

      /* =========================
       BUTTON
    ========================== */

      .submit-button {
        width: 100%;
        padding: 13px 15px;
        border: none;
        border-radius: 8px;
        background: #176b87;
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .submit-button:hover {
        background: #12566d;
      }

      .back-link {
        display: block;
        margin-top: 15px;
        color: #176b87;
        text-align: center;
        text-decoration: none;
        font-size: 14px;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      /* =========================
       MESSAGE
    ========================== */

      .message {
        padding: 12px 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        background: #fdecec;
        color: #b42318;
        font-size: 14px;
      }

      /* =========================
       RESPONSIVE
    ========================== */

      @media (max-width: 650px) {
        .page-wrapper {
          margin: 35px auto;
        }

        .appointment-card {
          padding: 28px 20px;
        }

        .page-heading {
          font-size: 24px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =========================
       NAVBAR
  ========================== -->

    <nav class="navbar">
      <div class="navbar-inner">
        <div class="brand">PatientCare</div>

        <div class="nav-links">
          <a href="{% url 'doctors' %}" class="nav-link"> Doctors </a>

          <a href="{% url 'logout' %}" class="nav-link"> Logout </a>
        </div>
      </div>
    </nav>

    <!-- =========================
       MAIN CONTENT
  ========================== -->

    <main class="page-wrapper">
      <div class="appointment-card">
        <h1 class="page-heading">Book Appointment</h1>

        <p class="page-description">
          Select a date and time for your appointment with the doctor.
        </p>

        <!-- ERROR MESSAGES -->

        {% if messages %} {% for message in messages %}

        <div class="message">{{ message }}</div>

        {% endfor %} {% endif %}

        <!-- DOCTOR -->

        <div class="doctor-box">
          <h2 class="doctor-name">Dr. {{ doctor.name }}</h2>

          <p class="doctor-specialization">{{ doctor.specialization }}</p>
        </div>

        <!-- APPOINTMENT FORM -->

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="appointment_date" class="form-label">
              Appointment Date & Time
            </label>

            <input
              type="datetime-local"
              id="appointment_date"
              name="appointment_date"
              class="form-input"
              required
            />
          </div>

          <button type="submit" class="submit-button">Book Appointment</button>
        </form>

        <a href="{% url 'doctors' %}" class="back-link"> ← Back to Doctors </a>
      </div>
    </main>
  </body>
</html>
```
