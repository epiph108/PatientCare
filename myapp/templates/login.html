<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient Login - PatientCare</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f7fb;
        color: #243447;
      }

      .navbar {
        background: #176b87;
        padding: 18px 7%;
        color: white;
      }

      .navbar-inner {
        max-width: 1100px;
        margin: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        font-size: 22px;
        font-weight: 700;
      }

      .nav-link {
        color: white;
        text-decoration: none;
        font-size: 14px;
      }

      .page-wrapper {
        width: 92%;
        max-width: 470px;
        margin: 70px auto;
      }

      .card {
        background: white;
        border-radius: 14px;
        padding: 38px;
        box-shadow: 0 8px 30px rgba(23, 107, 135, 0.1);
      }

      .page-title {
        margin: 0 0 8px;
        color: #176b87;
        font-size: 28px;
        text-align: center;
      }

      .page-subtitle {
        margin: 0 0 30px;
        color: #718096;
        text-align: center;
      }

      .messages {
        margin-bottom: 22px;
      }

      .message {
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .message.success {
        background: #e8f7ef;
        color: #197044;
      }

      .message.error {
        background: #fdecec;
        color: #b42318;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        font-weight: 600;
        color: #34495e;
      }

      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #d5dee7;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: #176b87;
      }

      .submit-button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 13px 20px;
        margin-top: 5px;
        background: #176b87;
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      .submit-button:hover {
        background: #12566d;
      }

      .bottom-text {
        text-align: center;
        margin-top: 22px;
        color: #718096;
        font-size: 14px;
        line-height: 1.8;
      }

      .bottom-text a {
        color: #176b87;
        text-decoration: none;
        font-weight: 600;
      }

      .bottom-text a:hover {
        text-decoration: underline;
      }

      @media (max-width: 500px) {
        .card {
          padding: 28px 22px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <div class="brand">PatientCare</div>

        <a href="{% url 'patient_register' %}" class="nav-link"> Register </a>
      </div>
    </nav>

    <main class="page-wrapper">
      <div class="messages">
        {% if messages %} {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %} {% endif %}
      </div>

      <div class="card">
        <h1 class="page-title">Patient Login</h1>

        <p class="page-subtitle">Sign in to access your patient account.</p>

        <form method="POST">
          {% csrf_token %}

          <div class="form-group">
            <label for="email"> Email Address </label>

            <input type="email" id="email" name="email" required />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input type="password" id="password" name="password" required />
          </div>

          <button type="submit" class="submit-button">Login</button>
        </form>

        <div class="bottom-text">
          Don't have an account?
          <a href="{% url 'patient_register' %}"> Register here </a>

          <br />

          Are you a doctor?
          <a href="{% url 'doctor_login' %}"> Doctor Login </a>
        </div>
      </div>
    </main>
  </body>
</html>
```
